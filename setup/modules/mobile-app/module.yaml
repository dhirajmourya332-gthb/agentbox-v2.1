id: mobile-app
kind: integration
category: extras
title: Phone app (Android)
description: Get the agentbox Android app onto your phone, either by downloading an app you already built (a link, no Expo account) or by building it with Expo EAS (cloud build; no Android SDK on the VM)
optional: true
depends: [mobile]
skills: []
default_roles: []
revoke: |
  Download: nothing to revoke. Build: on the VM `eas logout`, and revoke the session at
  https://expo.dev → Account settings → Sessions.
steps:
  - id: choose
    title: Download an existing app, or build it
    human: true
    instructions: |
      Two ways to get the app. Pick one in the terminal:

      1. Download an app you already built (fastest; no Expo login, no build). You need its APK
         link, e.g. the expo.dev/artifacts/… link from an earlier build (on this or another
         agentbox), or any https link to the APK:
           `sudo agentbox config set mobile.app_source download`
           `sudo agentbox config set mobile.app_url <APK link>`

      2. Build it yourself with Expo (a free expo.dev account; about 15 minutes on Expo's servers):
           `sudo agentbox config set mobile.app_source build && sudo agentbox integration connect mobile-app`
    copy: "sudo agentbox config set mobile.app_source download"
    check: "test -n \"$(agentbox config get mobile.app_source)\""
  - id: link
    when: "mobile.app_source == download"
    title: The APK link works
    human: true
    instructions: |
      Save the link to the APK you already have (it's shown with a QR code on the portal's
      Devices page, to open on the phone):
        `sudo agentbox config set mobile.app_url <APK link>`
    copy: "sudo agentbox config set mobile.app_url "
    check: "u=\"$(agentbox config get mobile.app_url)\"; test -n \"$u\" && curl -fsSL --max-time 30 -r 0-3 -o /dev/null \"$u\""
  - id: install
    when: "mobile.app_source == build"
    title: Install the EAS CLI
    run: install.sh
    check: "command -v eas && command -v agentbox-mobile-build"
  - id: login
    when: "mobile.app_source == build"
    title: Log in to Expo
    human: true
    instructions: |
      Create a free account at https://expo.dev if you don't have one, then in the terminal run
        `eas login`
      Then set your Expo owner:
        `sudo agentbox config set mobile.expo_owner <your-expo-username>`
    copy: "eas login"
    check: "eas whoami"
  - id: project
    when: "mobile.app_source == build"
    title: Create the Expo project (once)
    human: true
    instructions: |
      In the terminal run
        `agentbox-mobile-build --init`
      It prepares the app's folder and runs `eas init`: answer yes to create the project. Then save
      the project id it prints:
        `sudo agentbox config set mobile.eas_project_id <id>`
    copy: "agentbox-mobile-build --init"
    check: "test -n \"$(agentbox config get mobile.eas_project_id)\""
  - id: build
    when: "mobile.app_source == build"
    title: Build the APK
    run: build.sh
    instructions: |
      `agentbox-mobile-build` (about 15 minutes on Expo's servers). Open the build link it prints on
      your phone and install the APK.
    check: "test -n \"$(cd \"$(agentbox config get paths.work)/agentbox-mobile\" 2>/dev/null && eas build:list --platform android --status finished --limit 1 --json --non-interactive 2>/dev/null | jq -r '.[0].id // empty')\""
  - id: verify
    title: Verify
    run: verify.sh
    check: "test \"$(agentbox config get mobile.app_source)\" = download && test -n \"$(agentbox config get mobile.app_url)\" || eas whoami"
