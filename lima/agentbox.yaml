# agentbox on a local Lima VM (host: lima). This is a TEMPLATE: host/lima/up.sh fills in the
# @PLACEHOLDERS@ (Mac ports from --ports, size from --cpus/--memory/--disk) and adds the read-only
# repo mount (it needs an absolute path). Guest ports are the config defaults (7699-7702).
minimumLimaVersion: 2.0.0
base: template:ubuntu-24.04

vmType: vz
mountType: virtiofs
cpus: @CPUS@
memory: @MEMORY@
disk: @DISK@

# No host home mount: agents get full control of the VM, not of your Mac.
mounts: []

# Only the portal and the setup guide, on the Mac's 127.0.0.1. The terminal and screen are served
# through the portal (/term/, /screen/) behind its auth; everything else (ttyd 7702, noVNC 7701, VNC
# 5900, Chromium CDP 9222, the phone gateway 7710, …) stays inside the VM. First matching rule wins.
portForwards:
  - guestPort: 7700
    hostPort: @PORT_PORTAL@
  - guestPort: 7699
    hostPort: @PORT_GUIDE@
  - guestPortRange: [1, 65535]
    guestIP: 0.0.0.0
    guestIPMustBeZero: false
    proto: any
    ignore: true
