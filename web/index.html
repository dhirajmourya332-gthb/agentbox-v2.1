<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agentbox</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e8ee;
      --muted: #8a93a6; --accent: #7aa2ff; --ok: #4ade80; --bad: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif;
           display: grid; grid-template-columns: 220px 1fr; }
    nav { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 12px;
          display: flex; flex-direction: column; gap: 4px; }
    nav h1 { font-size: 16px; margin: 0 8px 16px; letter-spacing: .02em; }
    nav button { all: unset; cursor: pointer; padding: 8px 10px; border-radius: 6px; color: var(--muted); }
    nav button.active, nav button:hover { background: var(--line); color: var(--text); }
    nav .soon { margin-top: 16px; padding: 0 10px; color: var(--muted); font-size: 12px; }
    main { position: relative; min-width: 0; }
    .view { position: absolute; inset: 0; display: none; }
    .view.active { display: block; }
    iframe { width: 100%; height: 100%; border: 0; background: #000; }
    #health { padding: 24px; overflow: auto; }
    table { border-collapse: collapse; min-width: 420px; }
    td { padding: 6px 12px; border-bottom: 1px solid var(--line); }
    td:first-child { color: var(--muted); }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 24px 0 8px; }
  </style>
</head>
<body>
  <nav>
    <h1>agentbox</h1>
    <button data-view="computer" class="active">Computer</button>
    <button data-view="terminal">Terminal</button>
    <button data-view="health">Health</button>
    <div class="soon">Agents, groups, skills, schedules and activity arrive in later milestones.</div>
  </nav>
  <main>
    <section id="computer" class="view active"><iframe id="screen" title="Shared screen"></iframe></section>
    <section id="terminal" class="view"><iframe id="term" title="Terminal"></iframe></section>
    <section id="health" class="view"></section>
  </main>
  <script>
    const host = location.hostname;
    document.getElementById("screen").src =
      `http://${host}:7701/vnc.html?autoconnect=1&resize=scale&reconnect=1&show_dot=1`;
    document.getElementById("term").src = `http://${host}:7702/`;

    const views = document.querySelectorAll(".view");
    document.querySelectorAll("nav button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b === btn));
        views.forEach((v) => v.classList.toggle("active", v.id === btn.dataset.view));
        if (btn.dataset.view === "health") loadHealth();
      });
    });

    const cell = (ok, text) => `<td class="${ok ? "ok" : "bad"}">${text}</td>`;
    async function loadHealth() {
      const el = document.getElementById("health");
      try {
        const h = await (await fetch("/api/health")).json();
        const svc = Object.entries(h.services)
          .map(([k, v]) => `<tr><td>${k}</td>${cell(v === "active", v)}</tr>`).join("");
        const tools = Object.entries(h.tools)
          .map(([k, v]) => `<tr><td>${k}</td>${cell(!!v, v ?? "missing")}</tr>`).join("");
        el.innerHTML = `
          <h2>Services</h2><table>${svc}</table>
          <h2>Shared browser (CDP)</h2><table><tr><td>chromium</td>${cell(h.browser.ok, h.browser.version ?? "unreachable")}</tr></table>
          <h2>Tools</h2><table>${tools}</table>`;
      } catch (e) {
        el.innerHTML = `<p class="bad">Health check failed: ${e}</p>`;
      }
    }
  </script>
</body>
</html>
